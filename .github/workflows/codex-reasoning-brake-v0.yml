name: Chat Dev Reasoning Brake v0

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-reasoning-brake-v0
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'CODEX-BRAKE-V0|')
    runs-on: ubuntu-latest
    outputs:
      packet_valid: ${{ steps.packet.outputs.packet_valid }}
      contract_b64: ${{ steps.contract.outputs.contract_b64 }}
    steps:
      - id: packet
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          body = os.environ.get('ISSUE_BODY', '')
          required = [
              'packet_class: PUBLIC_SAFE',
              'decision_id:',
              'goal:',
              'provisional_decision:',
              'established_facts:',
              'material_assumptions:',
              'evidence_pointers:',
              'known_uncertainty:',
          ]
          valid = bool(body) and len(body) <= 8000 and all(token in body for token in required)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'packet_valid={str(valid).lower()}\n')
          PY

      - id: contract
        if: steps.packet.outputs.packet_valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const res = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'reasoning-brake-v0/FALSIFIER.md',
              ref: context.sha
            });
            if (Array.isArray(res.data) || !res.data.content) {
              core.setFailed('FALSIFIER.md did not resolve to a file');
              return;
            }
            core.setOutput('contract_b64', String(res.data.content).replace(/\n/g, ''));

      - name: Report invalid packet
        if: steps.packet.outputs.packet_valid != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'CODEX_BRAKE_V0_UNAVAILABLE\nstatus: UNAVAILABLE\nreason: INVALID_PACKET'
            });

  falsifier:
    needs: gate
    if: needs.gate.outputs.packet_valid == 'true'
    runs-on: [self-hosted, windows, chatgpt-host]
    timeout-minutes: 8
    steps:
      - name: Reject stale queued brake
        id: freshness
        shell: powershell
        env:
          CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          $created = [DateTimeOffset]::Parse($env:CREATED_AT)
          $age = ([DateTimeOffset]::UtcNow - $created).TotalMinutes
          $fresh = $age -lt 6
          "fresh=$($fresh.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "age_seconds=$([int]($age * 60))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Report expired queued brake
        if: steps.freshness.outputs.fresh != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'CODEX_BRAKE_V0_UNAVAILABLE\nstatus: UNAVAILABLE\nreason: EXPIRED_IN_QUEUE'
            });

      - name: Build isolated falsifier prompt
        if: steps.freshness.outputs.fresh == 'true'
        shell: powershell
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          CONTRACT_B64: ${{ needs.gate.outputs.contract_b64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'reasoning-brake-v0'
          Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $contractBytes = [Convert]::FromBase64String($env:CONTRACT_B64)
          $contract = [Text.Encoding]::UTF8.GetString($contractBytes)
          $prompt = $contract.TrimEnd() + "`n`nPROVISIONAL DECISION PACKET:`n" + $env:ISSUE_BODY + "`n"
          [IO.File]::WriteAllText((Join-Path $dir 'prompt.txt'), $prompt, [Text.UTF8Encoding]::new($false))

      - name: Run Sol-low falsifier
        id: codex
        if: steps.freshness.outputs.fresh == 'true'
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $dir = Join-Path $env:RUNNER_TEMP 'reasoning-brake-v0'
          Push-Location $dir
          try {
            $start = Get-Date
            Get-Content -Raw -LiteralPath 'prompt.txt' | codex exec --skip-git-repo-check --model gpt-5.6-sol -c 'model_reasoning_effort="low"' --sandbox read-only --ignore-user-config --output-last-message raw-result.txt -
            $rc = $LASTEXITCODE
            $elapsed = [int]((Get-Date) - $start).TotalSeconds
            "rc=$rc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "elapsed_seconds=$elapsed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } finally {
            Pop-Location
          }

      - name: Normalize result
        id: normalize
        if: steps.freshness.outputs.fresh == 'true' && steps.codex.outputs.rc == '0'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'reasoning-brake-v0'
          $raw = (Get-Content -Raw -LiteralPath (Join-Path $dir 'raw-result.txt')).Trim()
          $values = @{}
          foreach ($line in ($raw -split "`r?`n")) {
            $line = $line.Trim()
            if (-not $line -or -not $line.Contains(':')) { continue }
            $parts = $line.Split(':', 2)
            $values[$parts[0].Trim()] = $parts[1].Trim()
          }
          $status = $values['status']
          $required = @('material_issue','why_decision_changing','check_needed')
          $valid = ($status -eq 'PASS' -or $status -eq 'CHALLENGE')
          foreach ($key in $required) { if (-not $values.ContainsKey($key)) { $valid = $false } }
          if ($valid) {
            foreach ($key in $required) {
              $v = (($values[$key] -replace '\s+', ' ').Trim())
              if ($v.Length -gt 700) { $v = $v.Substring(0, 700) }
              $values[$key] = $v
            }
            $normalized = @(
              "status: $status"
              "material_issue: $($values['material_issue'])"
              "why_decision_changing: $($values['why_decision_changing'])"
              "check_needed: $($values['check_needed'])"
            ) -join "`n"
            [IO.File]::WriteAllText((Join-Path $dir 'normalized.txt'), $normalized + "`n", [Text.UTF8Encoding]::new($false))
          }
          "valid=$($valid.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Return valid brake result
        if: steps.freshness.outputs.fresh == 'true' && steps.codex.outputs.rc == '0' && steps.normalize.outputs.valid == 'true'
        uses: actions/github-script@v7
        env:
          RESULT_PATH: ${{ runner.temp }}\reasoning-brake-v0\normalized.txt
          ELAPSED: ${{ steps.codex.outputs.elapsed_seconds }}
        with:
          script: |
            const fs = require('fs');
            const normalized = fs.readFileSync(process.env.RESULT_PATH, 'utf8').trim();
            const body = [
              'CODEX_BRAKE_V0_COMPLETE',
              normalized,
              'model: gpt-5.6-sol',
              'reasoning: low',
              `elapsed_seconds: ${process.env.ELAPSED || 'unknown'}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Report Codex execution failure
        if: steps.freshness.outputs.fresh == 'true' && steps.codex.outputs.rc != '0'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'CODEX_BRAKE_V0_UNAVAILABLE\nstatus: UNAVAILABLE\nreason: CODEX_EXIT'
            });

      - name: Report invalid model result
        if: steps.freshness.outputs.fresh == 'true' && steps.codex.outputs.rc == '0' && steps.normalize.outputs.valid != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'CODEX_BRAKE_V0_UNAVAILABLE\nstatus: UNAVAILABLE\nreason: INVALID_RESULT'
            });
