name: Chat Dev Drive Local Retry PoC

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  trigger-smoke:
    if: github.event.issue.number == 79 && github.actor == github.repository_owner && github.event.comment.body == 'RUN_DRIVE_LOCAL_RETRY_SMOKE_V1'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm trigger
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'DRIVE_LOCAL_RETRY_TRIGGER_SMOKE_PASS'
            });
