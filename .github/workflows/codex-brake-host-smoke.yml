name: Codex Brake Host Smoke

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'CODEX-BRAKE-HOST-SMOKE|')
    runs-on: [self-hosted, windows, chatgpt-host]
    timeout-minutes: 5
    steps:
      - name: Probe persistent Codex session
        id: probe
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'codex-brake-host-smoke'
          Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          if (-not (Get-Command codex -ErrorAction SilentlyContinue)) {
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "reason=CODEX_NOT_INSTALLED" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          Push-Location $dir
          try {
            'Return exactly: CODEX_HOST_SMOKE_OK' | codex exec --skip-git-repo-check --model gpt-5.6-sol -c 'model_reasoning_effort="low"' --sandbox read-only --ignore-user-config --output-last-message result.txt -
            if ($LASTEXITCODE -ne 0) {
              "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "reason=CODEX_EXEC_FAILED" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              exit 0
            }
            $result = (Get-Content -Raw -LiteralPath result.txt).Trim()
            if ($result -eq 'CODEX_HOST_SMOKE_OK') {
              "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "reason=READY" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            } else {
              "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "reason=INVALID_RESULT" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            }
          } finally {
            Pop-Location
          }

      - name: Report smoke result
        uses: actions/github-script@v7
        env:
          READY: ${{ steps.probe.outputs.ready }}
          REASON: ${{ steps.probe.outputs.reason }}
        with:
          script: |
            const body = [
              'CODEX_BRAKE_HOST_SMOKE',
              `status: ${process.env.READY === 'true' ? 'PASS' : 'BLOCKED'}`,
              `reason: ${process.env.REASON || 'UNKNOWN'}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
