name: HARNESS-POC-01 Fresh Brake

on:
  push:
    branches:
      - exp/harness-poc-01

permissions:
  contents: read
  issues: write

jobs:
  harness:
    runs-on: ubuntu-latest
    env:
      CODEX_HOME: /tmp/codex-home
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Codex CLI
        run: npm install -g @openai/codex@latest
      - name: Restore ChatGPT subscription auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          test -n "$CODEX_AUTH_JSON"
          mkdir -p "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          codex login status

      # Run B first so A does not yet exist. Every call is a new `codex exec`
      # in a new empty /tmp repo; the checked-out workspace is chmod 000 while
      # the model runs, so no prior stage artifact or repo file is readable.
      - name: Run B fresh-brake then synthesis
        run: |
          for CASE_ID in 1 2 3; do
            python .github/benchmarks/harness_poc_01_runner.py run \
              --mode brake \
              --case "$CASE_ID" \
              --output "out/brake-$CASE_ID"
            python .github/benchmarks/harness_poc_01_runner.py run \
              --mode synth \
              --case "$CASE_ID" \
              --brake-file "out/brake-$CASE_ID/result.txt" \
              --output "out/synth-$CASE_ID"
          done

      - name: Run A direct
        run: |
          for CASE_ID in 1 2 3; do
            python .github/benchmarks/harness_poc_01_runner.py run \
              --mode direct \
              --case "$CASE_ID" \
              --output "out/direct-$CASE_ID"
          done

      - name: Stage exact outputs for provenance report
        run: |
          mkdir -p collected/direct collected/brake collected/synth
          for CASE_ID in 1 2 3; do
            cp -a "out/direct-$CASE_ID" "collected/direct/harness-direct-$CASE_ID"
            cp -a "out/brake-$CASE_ID" "collected/brake/harness-brake-$CASE_ID"
            cp -a "out/synth-$CASE_ID" "collected/synth/harness-synth-$CASE_ID"
          done

      - name: Build blinded comparison packet
        run: |
          python .github/benchmarks/harness_poc_01_runner.py report \
            --root collected \
            --run-id "${{ github.run_id }}" \
            --run-sha "${{ github.sha }}" \
            --output report

      - name: Publish blinded comparison issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "HARNESS-POC-01 RESULTS | run ${{ github.run_id }}" \
            --body-file report/issue-body.md)
          printf '%s\n' "$URL" | tee report/result-url.txt
          echo "Result: $URL" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: harness-poc-01-technical-${{ github.run_id }}
          path: |
            collected/
            report/
          if-no-files-found: error
          retention-days: 1
