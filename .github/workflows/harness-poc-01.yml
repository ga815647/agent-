name: HARNESS-POC-01 Fresh Brake

on:
  push:
    branches:
      - exp/harness-poc-01

permissions:
  contents: read
  issues: write

jobs:
  direct:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case_id: ['1', '2', '3']
    env:
      CODEX_HOME: /tmp/codex-home
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Codex CLI
        run: npm install -g @openai/codex@latest
      - name: Restore ChatGPT subscription auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          test -n "$CODEX_AUTH_JSON"
          mkdir -p "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          codex login status
      - name: Run DIRECT
        run: |
          python .github/benchmarks/harness_poc_01_runner.py run \
            --mode direct \
            --case "${{ matrix.case_id }}" \
            --output "out/direct-${{ matrix.case_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-direct-${{ matrix.case_id }}
          path: out/direct-${{ matrix.case_id }}/
          if-no-files-found: error
          retention-days: 1

  brake:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case_id: ['1', '2', '3']
    env:
      CODEX_HOME: /tmp/codex-home
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Codex CLI
        run: npm install -g @openai/codex@latest
      - name: Restore ChatGPT subscription auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          test -n "$CODEX_AUTH_JSON"
          mkdir -p "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          codex login status
      - name: Run fresh frame check
        run: |
          python .github/benchmarks/harness_poc_01_runner.py run \
            --mode brake \
            --case "${{ matrix.case_id }}" \
            --output "out/brake-${{ matrix.case_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-brake-${{ matrix.case_id }}
          path: out/brake-${{ matrix.case_id }}/
          if-no-files-found: error
          retention-days: 1

  synthesis:
    needs: brake
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case_id: ['1', '2', '3']
    env:
      CODEX_HOME: /tmp/codex-home
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Codex CLI
        run: npm install -g @openai/codex@latest
      - name: Restore ChatGPT subscription auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          test -n "$CODEX_AUTH_JSON"
          mkdir -p "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          codex login status
      - uses: actions/download-artifact@v4
        with:
          name: harness-brake-${{ matrix.case_id }}
          path: /tmp/brake-input
      - name: Run synthesis
        run: |
          python .github/benchmarks/harness_poc_01_runner.py run \
            --mode synth \
            --case "${{ matrix.case_id }}" \
            --brake-file /tmp/brake-input/result.txt \
            --output "out/synth-${{ matrix.case_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-synth-${{ matrix.case_id }}
          path: out/synth-${{ matrix.case_id }}/
          if-no-files-found: error
          retention-days: 1

  report:
    needs:
      - direct
      - brake
      - synthesis
    if: ${{ needs.direct.result == 'success' && needs.brake.result == 'success' && needs.synthesis.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: harness-direct-*
          path: collected/direct
      - uses: actions/download-artifact@v4
        with:
          pattern: harness-brake-*
          path: collected/brake
      - uses: actions/download-artifact@v4
        with:
          pattern: harness-synth-*
          path: collected/synth
      - name: Build blinded comparison packet
        run: |
          python .github/benchmarks/harness_poc_01_runner.py report \
            --root collected \
            --run-id "${{ github.run_id }}" \
            --run-sha "${{ github.sha }}" \
            --output report
      - name: Publish blinded comparison issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "HARNESS-POC-01 RESULTS | run ${{ github.run_id }}" \
            --body-file report/issue-body.md)
          printf '%s\n' "$URL" | tee report/result-url.txt
          echo "Result: $URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-poc-01-technical-${{ github.run_id }}
          path: |
            collected/
            report/
          if-no-files-found: error
          retention-days: 1
