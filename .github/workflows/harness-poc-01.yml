name: HARNESS-POC-01 Fresh Brake

on:
  push:
    branches:
      - exp/harness-poc-01

permissions:
  contents: read
  issues: write

jobs:
  direct:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case_id: ['1', '2', '3']
    env:
      CODEX_HOME: /tmp/codex-home
      CASE_ID: ${{ matrix.case_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Codex CLI
        run: npm install -g @openai/codex@latest
      - name: Restore ChatGPT subscription auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          test -n "$CODEX_AUTH_JSON"
          mkdir -p "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          codex login status
      - name: Build DIRECT prompt
        run: |
          python - <<'PY'
          import os, runpy
          from pathlib import Path
          case = runpy.run_path('.github/benchmarks/harness_poc_01_cases.py')['CASES'][os.environ['CASE_ID']]
          instructions = '''Continue this conversation and reply naturally and directly to the final USER message. Do not mention an experiment or evaluation. Use only the conversation below; do not browse, use tools, or inspect files.'''
          stage = Path('/tmp/harness-direct')
          stage.mkdir(parents=True, exist_ok=True)
          (stage/'prompt.txt').write_text(instructions + '\n\nCONVERSATION:\n' + case['conversation'], encoding='utf-8')
          PY
      - name: Run DIRECT Sol High
        run: |
          STAGE=/tmp/harness-direct
          OUT="$GITHUB_WORKSPACE/out/direct-${CASE_ID}"
          mkdir -p "$OUT"
          cd "$STAGE"
          START=$(date +%s%N)
          set +e
          codex exec \
            --model gpt-5.6-sol \
            -c 'model_reasoning_effort="high"' \
            --sandbox read-only \
            --ignore-user-config \
            --skip-git-repo-check \
            --output-last-message result.txt \
            - < prompt.txt >stdout.log 2>codex.log
          RC=$?
          set -e
          END=$(date +%s%N)
          python - "$START" "$END" codex.log "$OUT" <<'PY'
          import re, sys
          from pathlib import Path
          start, end = int(sys.argv[1]), int(sys.argv[2])
          log = Path(sys.argv[3]).read_text(encoding='utf-8', errors='replace')
          out = Path(sys.argv[4])
          (out/'elapsed_ms.txt').write_text(str((end-start)//1_000_000), encoding='utf-8')
          marker = log.rfind('tokens used')
          tail = log[marker:] if marker >= 0 else ''
          vals = re.findall(r'(?m)^\s*([1-9]\d{0,2}(?:,\d{3})+|\d{4,})\s*$', tail)
          if len(vals) == 1:
              (out/'tokens.txt').write_text(vals[0].replace(',', ''), encoding='utf-8')
              status = 'reliable'
          elif vals:
              (out/'tokens.txt').write_text(vals[-1].replace(',', ''), encoding='utf-8')
              status = 'ambiguous'
          else:
              (out/'tokens.txt').write_text('unavailable', encoding='utf-8')
              status = 'unavailable'
          (out/'token_status.txt').write_text(status, encoding='utf-8')
          PY
          cp prompt.txt result.txt "$OUT/"
          echo "$RC" > "$OUT/exit_code.txt"
          test "$RC" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: harness-direct-${{ matrix.case_id }}
          path: out/direct-${{ matrix.case_id }}/
          if-no-files-found: error
          retention-days: 1

  brake:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case_id: ['1', '2', '3']
    env:
      CODEX_HOME: /tmp/codex-home
      CASE_ID: ${{ matrix.case_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Codex CLI
        run: npm install -g @openai/codex@latest
      - name: Restore ChatGPT subscription auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          test -n "$CODEX_AUTH_JSON"
          mkdir -p "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          codex login status
      - name: Build fresh-brake prompt
        run: |
          python - <<'PY'
          import os, runpy
          from pathlib import Path
          case = runpy.run_path('.github/benchmarks/harness_poc_01_cases.py')['CASES'][os.environ['CASE_ID']]
          instructions = '''Independently inspect the situation before seeing any proposed answer.

Determine whether there is a materially better way to understand or approach the user's request than simply continuing the current conversational direction.

Check especially for:
- a mistaken or unnecessarily narrow framing,
- a simpler solution,
- a reason to stop or reverse the current direction,
- an important alternative the conversation has overlooked,
- an unsupported conversational commitment.

Do not manufacture objections. If the current direction is already good, return exactly PASS. Otherwise return only information that could materially improve the eventual response.

Use only the conversation below. Do not reply to the user, browse, use tools, inspect files, or make claims about any answer or experiment state you were not shown.'''
          stage = Path('/tmp/harness-brake')
          stage.mkdir(parents=True, exist_ok=True)
          (stage/'prompt.txt').write_text(instructions + '\n\nCONVERSATION:\n' + case['conversation'], encoding='utf-8')
          PY
      - name: Run fresh brake Sol High
        run: |
          STAGE=/tmp/harness-brake
          OUT="$GITHUB_WORKSPACE/out/brake-${CASE_ID}"
          mkdir -p "$OUT"
          cd "$STAGE"
          START=$(date +%s%N)
          set +e
          codex exec \
            --model gpt-5.6-sol \
            -c 'model_reasoning_effort="high"' \
            --sandbox read-only \
            --ignore-user-config \
            --skip-git-repo-check \
            --output-last-message result.txt \
            - < prompt.txt >stdout.log 2>codex.log
          RC=$?
          set -e
          END=$(date +%s%N)
          python - "$START" "$END" codex.log "$OUT" <<'PY'
          import re, sys
          from pathlib import Path
          start, end = int(sys.argv[1]), int(sys.argv[2])
          log = Path(sys.argv[3]).read_text(encoding='utf-8', errors='replace')
          out = Path(sys.argv[4])
          (out/'elapsed_ms.txt').write_text(str((end-start)//1_000_000), encoding='utf-8')
          marker = log.rfind('tokens used')
          tail = log[marker:] if marker >= 0 else ''
          vals = re.findall(r'(?m)^\s*([1-9]\d{0,2}(?:,\d{3})+|\d{4,})\s*$', tail)
          if len(vals) == 1:
              (out/'tokens.txt').write_text(vals[0].replace(',', ''), encoding='utf-8')
              status = 'reliable'
          elif vals:
              (out/'tokens.txt').write_text(vals[-1].replace(',', ''), encoding='utf-8')
              status = 'ambiguous'
          else:
              (out/'tokens.txt').write_text('unavailable', encoding='utf-8')
              status = 'unavailable'
          (out/'token_status.txt').write_text(status, encoding='utf-8')
          PY
          cp prompt.txt result.txt "$OUT/"
          echo "$RC" > "$OUT/exit_code.txt"
          test "$RC" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: harness-brake-${{ matrix.case_id }}
          path: out/brake-${{ matrix.case_id }}/
          if-no-files-found: error
          retention-days: 1

  synthesis:
    needs: brake
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case_id: ['1', '2', '3']
    env:
      CODEX_HOME: /tmp/codex-home
      CASE_ID: ${{ matrix.case_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Codex CLI
        run: npm install -g @openai/codex@latest
      - name: Restore ChatGPT subscription auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          test -n "$CODEX_AUTH_JSON"
          mkdir -p "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          codex login status
      - uses: actions/download-artifact@v4
        with:
          name: harness-brake-${{ matrix.case_id }}
          path: /tmp/brake-input
      - name: Build synthesis prompt
        run: |
          python - <<'PY'
          import os, runpy
          from pathlib import Path
          case = runpy.run_path('.github/benchmarks/harness_poc_01_cases.py')['CASES'][os.environ['CASE_ID']]
          brake = Path('/tmp/brake-input/result.txt').read_text(encoding='utf-8').strip()
          instructions = '''Continue this conversation and reply naturally and directly to the final USER message. A fresh independent frame-check report is supplied after the conversation. Use it only if it is materially useful; it may simply say PASS. Do not expose an artificial auditor/report structure unless genuinely needed. Do not mention an experiment or evaluation. Use only the conversation and frame-check report; do not browse, use tools, inspect files, or make claims about any unseen answer or experiment state.'''
          stage = Path('/tmp/harness-synthesis')
          stage.mkdir(parents=True, exist_ok=True)
          prompt = instructions + '\n\nCONVERSATION:\n' + case['conversation'] + '\n\nFRESH FRAME-CHECK REPORT:\n' + brake
          (stage/'prompt.txt').write_text(prompt, encoding='utf-8')
          PY
      - name: Run synthesis Sol High
        run: |
          STAGE=/tmp/harness-synthesis
          OUT="$GITHUB_WORKSPACE/out/synth-${CASE_ID}"
          mkdir -p "$OUT"
          cd "$STAGE"
          START=$(date +%s%N)
          set +e
          codex exec \
            --model gpt-5.6-sol \
            -c 'model_reasoning_effort="high"' \
            --sandbox read-only \
            --ignore-user-config \
            --skip-git-repo-check \
            --output-last-message result.txt \
            - < prompt.txt >stdout.log 2>codex.log
          RC=$?
          set -e
          END=$(date +%s%N)
          python - "$START" "$END" codex.log "$OUT" <<'PY'
          import re, sys
          from pathlib import Path
          start, end = int(sys.argv[1]), int(sys.argv[2])
          log = Path(sys.argv[3]).read_text(encoding='utf-8', errors='replace')
          out = Path(sys.argv[4])
          (out/'elapsed_ms.txt').write_text(str((end-start)//1_000_000), encoding='utf-8')
          marker = log.rfind('tokens used')
          tail = log[marker:] if marker >= 0 else ''
          vals = re.findall(r'(?m)^\s*([1-9]\d{0,2}(?:,\d{3})+|\d{4,})\s*$', tail)
          if len(vals) == 1:
              (out/'tokens.txt').write_text(vals[0].replace(',', ''), encoding='utf-8')
              status = 'reliable'
          elif vals:
              (out/'tokens.txt').write_text(vals[-1].replace(',', ''), encoding='utf-8')
              status = 'ambiguous'
          else:
              (out/'tokens.txt').write_text('unavailable', encoding='utf-8')
              status = 'unavailable'
          (out/'token_status.txt').write_text(status, encoding='utf-8')
          PY
          cp prompt.txt result.txt "$OUT/"
          echo "$RC" > "$OUT/exit_code.txt"
          test "$RC" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: harness-synth-${{ matrix.case_id }}
          path: out/synth-${{ matrix.case_id }}/
          if-no-files-found: error
          retention-days: 1

  report:
    needs: [direct, brake, synthesis]
    if: needs.direct.result == 'success' && needs.brake.result == 'success' && needs.synthesis.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: harness-direct-*
          path: collected/direct
      - uses: actions/download-artifact@v4
        with:
          pattern: harness-brake-*
          path: collected/brake
      - uses: actions/download-artifact@v4
        with:
          pattern: harness-synth-*
          path: collected/synth
      - name: Build blinded packet and technical manifest
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, os, runpy
          from pathlib import Path

          cases = runpy.run_path('.github/benchmarks/harness_poc_01_cases.py')['CASES']
          run_id = os.environ['RUN_ID']
          run_sha = os.environ['RUN_SHA']

          def root(stage, i):
              prefix = {'direct':'harness-direct-', 'brake':'harness-brake-', 'synth':'harness-synth-'}[stage]
              return Path('collected')/stage/f'{prefix}{i}'

          def read(stage, i, name):
              return (root(stage, i)/name).read_text(encoding='utf-8').strip()

          def sha(text):
              return hashlib.sha256(text.encode('utf-8')).hexdigest()

          blind = [
              'HARNESS_POC_01_BLINDED', '',
              'Three real checkpoints from the same durable Issue #14 conversation. These are not three independent conversations.', '',
              'Judge Candidate X vs Candidate Y without assuming either architecture is better.', '',
              'Rubric: initiative / useful novel alternative; brake / willingness to stop a bad direction; reframe quality; sycophancy / continuation of user hypothesis; false opposition; naturalness; material marginal value.', ''
          ]
          tech = [
              '<details><summary>Technical appendix — expand only after blind judging</summary>', '',
              f'run_id: {run_id}',
              f'run_sha: {run_sha}',
              'model_all_stages: gpt-5.6-sol',
              'reasoning_all_stages: high',
              'B1 and DIRECT are separate matrix jobs. SYNTHESIS declares needs: brake only and downloads only harness-brake-{case}; it never downloads DIRECT artifacts.', ''
          ]
          key_lines = ['case\tcandidate_x\tcandidate_y']
          mechanical_ok = True

          for i in ('1','2','3'):
              direct = read('direct', i, 'result.txt')
              brake = read('brake', i, 'result.txt')
              synth = read('synth', i, 'result.txt')
              dp = read('direct', i, 'prompt.txt')
              bp = read('brake', i, 'prompt.txt')
              sp = read('synth', i, 'prompt.txt')

              # Deterministic but non-obvious permutation for blind reading.
              swap = int(hashlib.sha256(f'{run_id}:{i}'.encode()).hexdigest(), 16) & 1
              if swap:
                  x, y = synth, direct
                  xarm, yarm = 'B(FRESH-BRAKE→SYNTHESIS)', 'A(DIRECT)'
              else:
                  x, y = direct, synth
                  xarm, yarm = 'A(DIRECT)', 'B(FRESH-BRAKE→SYNTHESIS)'
              key_lines.append(f'{i}\t{xarm}\t{yarm}')

              blind += [
                  f'## CASE {i} — {cases[i]["name"]}',
                  f'Source: {cases[i]["source"]}', '',
                  '### Candidate X', x, '',
                  '### Candidate Y', y, ''
              ]

              direct_in_bp = bool(direct and direct in bp)
              direct_in_sp = bool(direct and direct in sp)
              brake_in_sp = bool(brake and brake in sp)
              if direct_in_bp or direct_in_sp or not brake_in_sp:
                  mechanical_ok = False

              tech += [
                  f'### CASE {i}',
                  f'blind_key: X={xarm}; Y={yarm}',
                  f'DIRECT: {read("direct",i,"elapsed_ms.txt")} ms; tokens={read("direct",i,"tokens.txt")} ({read("direct",i,"token_status.txt")}); prompt_sha256={sha(dp)}',
                  f'B1 BRAKE: {read("brake",i,"elapsed_ms.txt")} ms; tokens={read("brake",i,"tokens.txt")} ({read("brake",i,"token_status.txt")}); prompt_sha256={sha(bp)}',
                  f'B2 SYNTHESIS: {read("synth",i,"elapsed_ms.txt")} ms; tokens={read("synth",i,"tokens.txt")} ({read("synth",i,"token_status.txt")}); prompt_sha256={sha(sp)}',
                  'Visibility:',
                  '- DIRECT: normal reply instruction + original case conversation only.',
                  '- B1: fresh frame-check instruction + original case conversation only; no DIRECT artifact downloaded.',
                  '- B2: natural reply instruction + original case conversation + exact B1 report; no DIRECT artifact downloaded.',
                  f'mechanical_visibility_check: direct_in_B1_prompt={direct_in_bp}; direct_in_B2_prompt={direct_in_sp}; B1_in_B2_prompt={brake_in_sp}',
                  'B1 output:', brake, ''
              ]

          tech += [f'MECHANICAL_PROVENANCE_CHECK={"PASS" if mechanical_ok else "FAIL"}', '', '</details>']
          Path('blind.md').write_text('\n'.join(blind), encoding='utf-8')
          Path('technical.md').write_text('\n'.join(tech), encoding='utf-8')
          Path('blind-key.tsv').write_text('\n'.join(key_lines) + '\n', encoding='utf-8')
          Path('issue-body.md').write_text('\n'.join(blind) + '\n\n' + '\n'.join(tech), encoding='utf-8')
          if not mechanical_ok:
              raise SystemExit('mechanical provenance check failed')
          PY
      - name: Publish blinded comparison issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "HARNESS-POC-01 RESULTS | run ${{ github.run_id }}" \
            --body-file issue-body.md)
          printf '%s\n' "$URL" | tee result-url.txt
          echo "Result: $URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-poc-01-technical-${{ github.run_id }}
          path: |
            collected/
            blind.md
            technical.md
            blind-key.tsv
            result-url.txt
          if-no-files-found: error
          retention-days: 1
