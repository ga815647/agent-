name: Subchat Fanout PoC

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  workers:
    if: startsWith(github.event.issue.title, 'SUBCHAT-FANOUT')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [solver-a, solver-b, falsifier]
    steps:
      - name: Produce isolated mock worker result
        shell: bash
        run: |
          mkdir -p out
          cat > "out/${{ matrix.role }}.md" <<EOF
          [WORKER:${{ matrix.role }}]
          source_issue: #${{ github.event.issue.number }}
          run_id: ${{ github.run_id }}
          isolation_key: ${{ strategy.job-index }}-${{ matrix.role }}
          status: WORKER_OK
          EOF
      - name: Upload worker result
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.role }}
          path: out/${{ matrix.role }}.md
          retention-days: 1

  collect:
    if: startsWith(github.event.issue.title, 'SUBCHAT-FANOUT')
    needs: workers
    runs-on: ubuntu-latest
    steps:
      - name: Download all worker results
        uses: actions/download-artifact@v4
        with:
          pattern: worker-*
          path: results
          merge-multiple: true
      - name: Build fan-in payload
        shell: bash
        run: |
          {
            echo 'SUBCHAT_FANOUT_ACK'
            echo
            echo 'status: FANOUT_FANIN_OK'
            echo 'workers: 3'
            echo 'run_id: ${{ github.run_id }}'
            echo
            for f in results/*.md; do
              cat "$f"
              echo
            done
          } > fanin.md
      - name: Return results to issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('fanin.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
