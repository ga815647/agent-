name: Ordinary Chat PoC-3B headed GitHub Chrome

on:
  workflow_dispatch:
  push:
    paths:
      - 'ordinary-chat-poc3b/**'
      - '.github/workflows/ordinary-chat-github-poc3b.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ordinary-chat-poc3b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check

      - name: Install headed desktop + noVNC + cloudflared
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11vnc novnc websockify
          curl -fsSL -o "$RUNNER_TEMP/cloudflared.deb" https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i "$RUNNER_TEMP/cloudflared.deb"

      - name: Start headed Chrome and secure noVNC tunnel
        env:
          POC3A_ADMIN_TOKEN: ${{ secrets.POC3A_ADMIN_TOKEN }}
        run: |
          set -e
          export DISPLAY=:99
          Xvfb :99 -screen 0 1365x900x24 -ac >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          sleep 2
          VNC_PASS="${POC3A_ADMIN_TOKEN:0:8}"
          x11vnc -storepasswd "$VNC_PASS" "$RUNNER_TEMP/vnc.pass" >/dev/null
          x11vnc -display :99 -rfbauth "$RUNNER_TEMP/vnc.pass" -forever -shared -localhost -rfbport 5900 >"$RUNNER_TEMP/x11vnc.log" 2>&1 &
          websockify --web=/usr/share/novnc 6080 localhost:5900 >"$RUNNER_TEMP/websockify.log" 2>&1 &
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo 'NO_CHROME_FOUND'; exit 2; fi
          "$CHROME" --user-data-dir="$RUNNER_TEMP/chatgpt-profile" --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --no-first-run --no-default-browser-check --disable-dev-shm-usage --window-size=1365,900 https://chatgpt.com/ >"$RUNNER_TEMP/chrome.log" 2>&1 &

          CDP_READY=''
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then CDP_READY=1; break; fi
            sleep 1
          done
          if [ -z "$CDP_READY" ]; then
            echo 'CDP_NOT_READY'
            echo '--- chrome.log ---'
            cat "$RUNNER_TEMP/chrome.log" || true
            exit 4
          fi
          echo 'CDP_READY'

          cloudflared tunnel --url http://127.0.0.1:6080 --no-autoupdate >"$RUNNER_TEMP/cloudflared.log" 2>&1 &
          URL=''
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done
          if [ -z "$URL" ]; then cat "$RUNNER_TEMP/cloudflared.log"; exit 3; fi
          echo "NOVNC_URL=${URL}/vnc.html?autoconnect=1&resize=scale"
          echo 'VNC_PASSWORD = first 8 characters of the existing POC3A_ADMIN_TOKEN secret.'
          echo 'LOGIN_WINDOW_OPEN: sign into ChatGPT manually. The runner will auto-detect the ordinary Chat composer and send the fixed PoC prompt.'

      - name: Wait for manual login then run fixed ordinary Chat test
        env:
          CDP_URL: http://127.0.0.1:9222
        run: node poc3b.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-chat-poc3b-result
          path: ordinary-chat-poc3b/poc3b-result.json
          if-no-files-found: warn
