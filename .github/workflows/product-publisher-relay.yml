name: One-shot product publisher credential relay

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/product-publisher-relay.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: product-publisher-relay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  relay:
    if: >-
      github.repository == 'ga815647/agent-' &&
      github.event.pull_request.number == 118 &&
      github.event.pull_request.head.repo.full_name == 'ga815647/agent-' &&
      github.event.pull_request.head.ref == 'chatdev/product-closeout-contracts-20260914'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELAY_NONCE: product-a-20260915-616695f-v1
      RELAY_TOKEN: ${{ github.token }}
    steps:
      - name: Encrypt repository-scoped token and publish relay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import secrets
          import subprocess
          import urllib.request
          from pathlib import Path

          public_key_hex = """
          2d2d2d2d2d424547494e205055424c4943204b45592d2d2d2d2d0a4d4949426f
          6a414e42676b71686b6947397730424151454641414f43415938414d49494269
          674b43415945416e5052443371496c6877796b4771612b373256430a68713570
          735a306f707043674d677257676564584d4a2f5874454a596174677a32514b61
          364b6b584f59527a345054733569457a376647473754573332516b780a4d6a31
          4d4c2f4f6961775052785a316e2b524c385336797a4a4132503551676f555065
          69616e3361564f4b48324f6e37415a4a636e6252744e766f313831496f0a3842
          585a4a46546a30322f776251424b54566a733433576b3966786b726e702f6546
          494e68626658444b466353755258616a43784a5a6d6a30654d75517739500a4c
          5631656a6d4541724c4b3375364842572b7136443959507359476d6f67434166
          6439667235706837685833513164754870577a684a744c63646e7964456f680a
          2f4f5944773971523262436a53334b774668506959394957443333503546494d
          722f413155446a58692b343533566b736e35624c486f5274416766397541776d
          0a6730396f66487272724661344567636b54312f6a7376445a62326750693638
          5a70674a73535838565a4a724e7047747247474343566b6a7845526455754634
          4b0a536b4663674b383535517544627643365368574d432f4d59726c6e477746
          32467a41746b36557256436477356a537155445a676a36345436496c62577458
          53700a72776a4e335837674d48716b6242686a46686a734850792b4f49673249
          36576c455756444d5962464554637841674d424141453d0a2d2d2d2d2d454e44
          205055424c4943204b45592d2d2d2d2d0a
          """
          public_key = bytes.fromhex("".join(public_key_hex.split()))
          Path("relay-public.pem").write_bytes(public_key)
          key_material = secrets.token_bytes(80)
          encryption_key = key_material[:32]
          mac_key = key_material[32:64]
          iv = key_material[64:]
          wrapped_key = subprocess.run(
              [
                  "openssl", "pkeyutl", "-encrypt", "-pubin",
                  "-inkey", "relay-public.pem",
                  "-pkeyopt", "rsa_padding_mode:oaep",
                  "-pkeyopt", "rsa_oaep_md:sha256",
              ],
              input=key_material,
              stdout=subprocess.PIPE,
              check=True,
          ).stdout
          ciphertext = subprocess.run(
              [
                  "openssl", "enc", "-aes-256-cbc",
                  "-K", encryption_key.hex(), "-iv", iv.hex(),
              ],
              input=os.environ["RELAY_TOKEN"].encode("utf-8"),
              stdout=subprocess.PIPE,
              check=True,
          ).stdout
          tag = hmac.new(mac_key, ciphertext, hashlib.sha256).digest()
          relay = base64.b64encode(json.dumps({
              "wrapped_key": base64.b64encode(wrapped_key).decode("ascii"),
              "ciphertext": base64.b64encode(ciphertext).decode("ascii"),
              "tag": base64.b64encode(tag).decode("ascii"),
          }, sort_keys=True, separators=(",", ":")).encode("utf-8")).decode("ascii")
          marker = "<!-- chatdev-publisher-relay:" + os.environ["RELAY_NONCE"] + " -->"
          body = marker + "\nAuthorized one-shot encrypted credential relay.\n\n```text\n" + relay + "\n```"
          request = urllib.request.Request(
              "https://api.github.com/repos/ga815647/agent-/issues/118/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["RELAY_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "chatdev-product-publisher-relay-v1",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              comment = json.load(response)
          Path("comment-id.txt").write_text(str(comment["id"]), encoding="ascii")
          print(json.dumps({"status": "RELAY_READY", "comment_id": comment["id"], "nonce": os.environ["RELAY_NONCE"]}))
          PY

      - name: Hold token until the VPS consumes and deletes the relay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          comment_id = Path("comment-id.txt").read_text(encoding="ascii").strip()
          url = "https://api.github.com/repos/ga815647/agent-/issues/comments/" + comment_id
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["RELAY_TOKEN"],
              "User-Agent": "chatdev-product-publisher-relay-v1",
          }
          for _ in range(150):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30):
                      pass
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      print("RELAY_CONSUMED")
                      raise SystemExit(0)
                  raise
              time.sleep(5)
          request = urllib.request.Request(url, headers=headers, method="DELETE")
          with urllib.request.urlopen(request, timeout=30):
              pass
          raise SystemExit("RELAY_EXPIRED_WITHOUT_CONSUMPTION")
          PY

      - name: Remove runner-local relay material
        if: always()
        shell: bash
        run: rm -f relay-public.pem comment-id.txt
