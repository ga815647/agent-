name: Subchat Bridge PoC

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue that receives the execution status
        required: true
        type: string
      prompt:
        description: Payload to submit to a fresh ordinary ChatGPT conversation
        required: true
        type: string

concurrency:
  group: persistent-chatgpt-host-poc
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  bridge-poc:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'SUBCHAT-POC')
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const preview = body.slice(0, 1200);
            const comment = [
              'SUBCHAT_POC_ACK',
              '',
              `status: BRIDGE_OK`,
              `run_id: ${context.runId}`,
              `issue: #${context.issue.number}`,
              '',
              'payload_preview:',
              '```',
              preview,
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  persistent-host-poc:
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.title == 'SUBCHAT-HOST-POC' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, windows, chatgpt-host]
    timeout-minutes: 10
    env:
      SUBCHAT_HOST_ISSUE_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || inputs.issue_number }}
      SUBCHAT_HOST_PROMPT: ${{ github.event_name == 'issues' && github.event.issue.body || inputs.prompt }}
    steps:
      - name: Submit payload through the persistent ChatGPT host
        id: execute
        shell: powershell
        continue-on-error: true
        env:
          SUBCHAT_HOST_RESULT_PATH: ${{ runner.temp }}\subchat-host-result.json
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = 'E:\CS\program\agent-\ordinary-chat-poc3b\persistent-host.ps1'
          if (-not (Test-Path -LiteralPath $launcher)) {
            throw "Persistent-host launcher not found: $launcher"
          }

          try {
            $controllerOutput = & $launcher dispatch 2>&1 | Out-String
            $controllerExit = $LASTEXITCODE
            [IO.File]::WriteAllText(
              $env:SUBCHAT_HOST_RESULT_PATH,
              $controllerOutput.Trim(),
              [Text.UTF8Encoding]::new($false)
            )
            if ($controllerExit -ne 0) { exit $controllerExit }
          }
          catch {
            $fallback = [ordered]@{
              status = 'ERROR'
              host_health = 'FAIL'
              authentication = 'UNKNOWN'
              ordinary_conversation_created = $false
              project_landing_used = $false
              project_conversation_created = $false
              fixed_prompt_submitted = $false
              conversation_url = $null
              rate_limit_notice_seen = $false
              rate_limit_notice_dismissed = $false
              rate_limit_recovered = $false
              retry_allowed_now = $false
              assistant_output_accessed = $false
            } | ConvertTo-Json
            [IO.File]::WriteAllText(
              $env:SUBCHAT_HOST_RESULT_PATH,
              $fallback,
              [Text.UTF8Encoding]::new($false)
            )
            exit 1
          }

      - name: Return execution status to the issue
        if: always()
        uses: actions/github-script@v7
        env:
          SUBCHAT_HOST_RESULT_PATH: ${{ runner.temp }}\subchat-host-result.json
        with:
          script: |
            const fs = require('fs');
            const issueNumber = Number(process.env.SUBCHAT_HOST_ISSUE_NUMBER);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.setFailed('Invalid originating issue number.');
              return;
            }

            let result;
            try {
              result = JSON.parse(fs.readFileSync(process.env.SUBCHAT_HOST_RESULT_PATH, 'utf8'));
            } catch {
              result = {
                status: 'ERROR',
                host_health: 'FAIL',
                authentication: 'UNKNOWN',
                ordinary_conversation_created: false,
                project_landing_used: false,
                project_conversation_created: false,
                fixed_prompt_submitted: false,
                conversation_url: null,
                rate_limit_notice_seen: false,
                rate_limit_notice_dismissed: false,
                rate_limit_recovered: false,
                retry_allowed_now: false,
                assistant_output_accessed: false
              };
            }

            const passed = result.status === 'PASS' &&
              result.authentication === 'AUTHENTICATED' &&
              result.target_kind === 'PROJECT' &&
              result.project_landing_used === true &&
              result.project_conversation_created === true &&
              result.ordinary_conversation_created === true &&
              result.fixed_prompt_submitted === true &&
              result.assistant_output_accessed === false;
            const rateLimited = result.status === 'RATE_LIMITED';
            const rateLimitNotice = rateLimited
              ? 'HARD_LIMIT'
              : result.rate_limit_notice_seen === true && result.rate_limit_recovered === true
                ? 'RECOVERED'
                : 'NOT_SEEN';
            const comment = [
              'SUBCHAT_HOST_ACK',
              '',
              `status: ${passed ? 'PASS' : rateLimited ? 'RATE_LIMITED' : 'FAIL'}`,
              `issue: #${issueNumber}`,
              `run_id: ${context.runId}`,
              `host_health: ${result.host_health || 'UNKNOWN'}`,
              `auth_state: ${result.authentication || 'UNKNOWN'}`,
              `target_kind: ${result.target_kind || 'UNKNOWN'}`,
              `project_landing: ${result.project_landing_used === true ? 'PASS' : 'FAIL'}`,
              `project_conversation: ${result.project_conversation_created === true ? 'PASS' : 'FAIL'}`,
              `conversation_creation: ${result.ordinary_conversation_created === true ? 'PASS' : 'FAIL'}`,
              `prompt_submission: ${result.fixed_prompt_submitted === true ? 'PASS' : 'FAIL'}`,
              `conversation_url: ${result.conversation_url || 'NOT_AVAILABLE'}`,
              `rate_limit_notice: ${rateLimitNotice}`,
              `retry_allowed_now: ${result.retry_allowed_now === true ? 'true' : 'false'}`,
              ...(Number.isInteger(result.retry_after_seconds) ? [`retry_after_seconds: ${result.retry_after_seconds}`] : []),
              `assistant_output_accessed: ${result.assistant_output_accessed === true ? 'true' : 'false'}`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });
            if (!passed) {
              core.setFailed(rateLimited
                ? 'Persistent ChatGPT host is in a bounded rate-limit cooldown.'
                : 'Persistent ChatGPT host execution failed.');
            }
