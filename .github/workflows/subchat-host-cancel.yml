name: Subchat Host Cancel Recovery

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  cancel-stuck-subchat-host-run:
    if: >-
      github.event.issue.title == 'SUBCHAT-HOST-CANCEL' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate target and cancel
        uses: actions/github-script@v7
        with:
          script: |
            const match = context.payload.issue.body?.match(/^run_id:\s*(\d+)\s*$/m);
            if (!match) {
              core.setFailed('Issue body must contain exactly one public-safe run_id line.');
              return;
            }
            const runId = Number(match[1]);
            if (!Number.isSafeInteger(runId) || runId < 1) {
              core.setFailed('Invalid run_id.');
              return;
            }

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            if (run.name !== 'Subchat Bridge PoC' || run.event !== 'issues') {
              core.setFailed(`Refusing to cancel non-subchat run: ${run.name} / ${run.event}`);
              return;
            }
            if (!['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status)) {
              core.setFailed(`Target run is not cancellable: ${run.status}`);
              return;
            }

            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'SUBCHAT_HOST_CANCEL_ACK',
                '',
                'status: PASS',
                `target_run_id: ${runId}`,
                `target_workflow: ${run.name}`
              ].join('\n')
            });
